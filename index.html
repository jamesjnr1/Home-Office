    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,500;1,600&display=swap"
      rel="stylesheet"
    />
    <title>Home-Office Pharmacy &amp; Clinic</title>
    <meta name="description" content="Home-Office Pharmacy &amp; Clinic at Buduburam Estate Junction, Ghana — medicines, counselling, clinical consultations and lab tests. Open every day. Call 055 880 2400." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://pharmacy.home-officegroup.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Home-Office Pharmacy &amp; Clinic" />
    <meta property="og:title" content="Home-Office Pharmacy &amp; Clinic — Buduburam Estate Junction" />
    <meta property="og:description" content="Home-Office Pharmacy &amp; Clinic at Buduburam Estate Junction, Ghana — medicines, counselling, clinical consultations and lab tests. Open every day. Call 055 880 2400." />
    <meta property="og:url" content="https://pharmacy.home-officegroup.com/" />
    <meta property="og:image" content="https://pharmacy.home-officegroup.com/images/storefront-1.png" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Home-Office Pharmacy & Clinic",
      "alternateName": ["Home-Office Pharmacy", "Home-Office Pharmacy Buduburam"],
      "url": "https://pharmacy.home-officegroup.com/"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Pharmacy",
      "name": "Home-Office Pharmacy & Clinic",
      "alternateName": "Home-Office Pharmacy",
      "url": "https://pharmacy.home-officegroup.com/",
      "logo": "https://pharmacy.home-officegroup.com/logo-mark.png",
      "image": ["https://pharmacy.home-officegroup.com/images/storefront-1.png", "https://pharmacy.home-officegroup.com/images/pharmacy-interior.png"],
      "telephone": "+233558802400",
      "address": { "@type": "PostalAddress", "streetAddress": "Estate Junction", "addressLocality": "Buduburam", "addressCountry": "GH" },
      "openingHoursSpecification": [
        { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"], "opens": "08:00", "closes": "22:00" },
        { "@type": "OpeningHoursSpecification", "dayOfWeek": "Sunday", "opens": "12:00", "closes": "22:00" }
      ],
      "parentOrganization": { "@type": "Organization", "name": "Home-Office Group of Companies", "url": "https://www.home-officegroup.com/" }
    }
    </script>
    <!-- Styles the plain-text copy of each page built into #root for
         search engines (scripts/prerender.mjs), in case a slow
         connection shows it for a moment before the site loads. -->
    <style>
      [data-prerendered] { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1f2937; line-height: 1.65; }
      [data-prerendered] header { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; padding-bottom: 16px; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
      [data-prerendered] header > a { font-weight: 700; font-size: 16px; }
      [data-prerendered] a { color: #198fcc; text-decoration: none; }
      [data-prerendered] h1 { font-size: 30px; line-height: 1.2; margin: 32px 0 12px; }
      [data-prerendered] h2 { font-size: 20px; line-height: 1.35; margin: 28px 0 8px; }
      [data-prerendered] footer { margin-top: 32px; font-size: 13px; color: #6b7280; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
